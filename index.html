<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOGG 学习笔记本 · 总目录</title>
<style>
:root{--ink:#24505B;--ink-deep:#16333B;--teal:#2E5A66;--paper:#FBFBF8;--gold:#E8C558;--gold-deep:#B08A1E;--line:#D5DEDC;--mist:#EEF3F2;--accent:#2E5A66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink-deep);font-family:"Noto Serif SC","Songti SC","PingFang SC",Georgia,serif;line-height:1.7}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.layout{display:flex;min-height:100vh}
.side{flex:0 0 260px;position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;gap:18px}
.main{flex:1;min-width:0;padding:26px 34px 70px;max-width:1040px}
.brand{font-size:19px;font-weight:700;line-height:1.3}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--ink);letter-spacing:.14em;margin-top:2px}
.search{position:relative}
.search input{width:100%;padding:10px 32px 10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--teal)}
#q-clr{position:absolute;right:8px;top:8px;border:none;background:none;font-size:16px;color:var(--ink);display:none}
#q-hint{font-size:12px;color:var(--ink);margin-top:6px;opacity:.8}
.fgroup{font-size:12px;color:var(--ink)}
.fgroup .lab{letter-spacing:.1em;margin-bottom:5px}
.fbtns{display:flex;flex-wrap:wrap;gap:5px}
.fbtns button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:2px 10px;font-size:12px;color:var(--ink)}
.fbtns button.on{background:var(--ink-deep);color:#fff;border-color:var(--ink-deep)}
.side-nav{font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.side-nav a{padding:6px 10px;border-radius:8px;color:var(--ink)}
.side-nav a:hover,.side-nav a.on{background:var(--mist);color:var(--ink-deep)}
.side-nav a .n{float:right;font-size:12px;opacity:.6}
.sync-box{margin-top:auto;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;background:var(--paper)}
.sync-box .t{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}
#st-dot{width:8px;height:8px;border-radius:50%;background:#C9CFCE;display:inline-block}
#st-dot.on{background:#3F9C6B}
.sync-box input{width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px}
.sync-box .row{display:flex;gap:6px;margin-top:8px}
.sync-box .row button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px;font-size:12px}
#sync-body{display:none;margin-top:6px}
.sync-box.open #sync-body{display:block}
#sync-status{margin-top:6px;color:var(--ink);opacity:.85}
.foot{font-size:11.5px;color:var(--ink);opacity:.7;text-align:center}
/* 课程 tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-size:14px;display:flex;flex-direction:column;align-items:flex-start;line-height:1.35;min-width:120px;border-left:5px solid var(--c)}
.tab b{font-size:15px}
.tab small{font-size:11.5px;color:var(--ink)}
.tab.on{background:var(--c);border-color:var(--c);color:#fff}
.tab.on small{color:rgba(255,255,255,.85)}
.phead{margin:6px 0 16px}
.phead h1{font-size:26px;margin:0;line-height:1.3}
.phead h1 span{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:17px;color:var(--teal);margin-left:10px}
.phead p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.lv{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.lv.hit{box-shadow:0 0 0 3px var(--gold)}
.lv-head{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:#FCFCF9;flex-wrap:wrap}
.lv-head b{font-size:16px;color:var(--c)}
.lv-head .age{font-size:12px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.lv-head .goal{font-size:13px;color:var(--ink);flex:1;min-width:200px}
.lv-head .lex{font-size:12px;color:var(--ink);opacity:.8}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0}
.unit{display:block;padding:14px 18px;border-right:1px solid var(--line);min-height:96px}
.unit:last-child{border-right:none}
.unit.has:hover{background:var(--mist)}
.unit .n{font-size:11px;letter-spacing:.12em;color:var(--c)}
.unit .t{font-size:15.5px;font-weight:600;margin-top:2px}
.unit .e{font-family:Georgia,serif;font-style:italic;font-size:13px;color:var(--teal)}
.unit .yrs{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.unit .yr{font-size:11.5px;background:var(--mist);border-radius:10px;padding:1px 9px;color:var(--ink)}
.unit .yr.done{background:#E3F1EA;color:#2E6B57}
.unit.none{opacity:.5}
.unit.none .yr{background:none;padding:0}
@media(max-width:560px){.units{grid-template-columns:1fr}.unit{border-right:none;border-top:1px solid var(--line)}}
/* 讲座 / 内部 */
h2{font-size:15px;letter-spacing:.08em;color:var(--teal);border-bottom:2px solid var(--gold);display:inline-block;padding-bottom:2px;margin:30px 0 12px}
h3.yr{font-size:13px;color:var(--ink);letter-spacing:.1em;margin:14px 0 8px}
.cards{display:flex;flex-direction:column;gap:10px}
a.card{display:block;background:#fff;border:1px solid var(--line);border-left:4px solid var(--c,var(--teal));border-radius:10px;padding:12px 16px}
a.card:hover{background:#FCFCF9;border-color:var(--gold)}
.card-top{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink);flex-wrap:wrap}
.card-top .tag{background:var(--mist);border-radius:10px;padding:0 8px}
.card-top .st{border-radius:10px;padding:0 8px}
.st.ok{background:#E3F1EA;color:#2E6B57}.st.redo{background:#FBEAD6;color:#B25A1B}.st.draft{background:var(--mist);color:var(--ink)}
.card .ti{font-size:16px;font-weight:600;margin-top:3px}
.card .ti span{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:13.5px;color:var(--teal);margin-left:8px}
.card .desc{font-size:13.5px;color:var(--ink);margin-top:2px}
.card .snip{font-size:13px;color:var(--ink);margin-top:4px;padding:6px 10px;background:var(--paper);border-radius:6px;line-height:1.6}
mark{background:var(--gold);color:inherit;padding:0 2px;border-radius:2px}
#count{font-size:13px;color:var(--ink);margin:4px 0 12px}
#count a{border-bottom:1px solid var(--gold)}
.empty{color:var(--ink);font-size:14px;padding:30px 0;text-align:center;opacity:.8}
.recent{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-bottom:18px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.recent .l{font-size:12px;letter-spacing:.1em;color:var(--ink)}
.recent a{border-bottom:1px solid var(--gold)}
.recent small{color:var(--ink);opacity:.75}
#side-toggle{display:none;position:fixed;left:12px;bottom:12px;z-index:9;border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
@media(max-width:820px){.side{position:fixed;left:-280px;transition:.2s;z-index:8}.side.open{left:0}.main{padding:18px 16px 70px}#side-toggle{display:block}}
</style>
</head>
<body>
<div class="layout">
<aside class="side" id="side">
  <div class="brand">FOGG 学习笔记本<small>SHIRLEY · STUDY NOTEBOOK</small></div>
  <div class="search">
    <input id="q" type="search" placeholder="搜全站：术语、句子、老师、学生…" autocomplete="off">
    <button id="q-clr" title="清空">×</button>
    <div id="q-hint">输入关键词搜全文；空着就浏览课程目录</div>
  </div>
  <div class="fgroup"><div class="lab">老师</div><div class="fbtns" id="fl-teacher"></div></div>
  <div class="fgroup"><div class="lab">年份</div><div class="fbtns" id="fl-year"></div></div>
  <div class="fgroup"><div class="lab">状态</div><div class="fbtns" id="fl-status"></div></div>
  <div class="fgroup"><div class="lab">排序</div><div class="fbtns" id="fl-sort"></div></div>
  <div class="side-nav" id="side-nav"></div>
  <div class="sync-box" id="sync-box">
    <div class="t" id="sync-title"><span id="st-dot"></span>云同步（Gist）</div>
    <div id="sync-body">
      <input id="gist-id" placeholder="Gist ID">
      <input id="gist-token" type="password" placeholder="GitHub Token（只存本机）">
      <div class="row"><button id="sync-save">保存</button><button id="sync-clear">清除</button></div>
      <div id="sync-status"></div>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</aside>
<main class="main" id="main"></main>
</div>
<button id="side-toggle">目录 / 搜索</button>
<script src="catalog.js"></script>
<script>
(function(){
var C=window.CATALOG||{programs:[],classes:[],pages:[]};
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var reEsc=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')};
function fmtDate(d){return d?String(d).replace(/-/g,'.'):''}
function lastRead(k){try{return +localStorage.getItem('__last_read_'+k)||0}catch(e){return 0}}
function agoText(ts){var d=Math.floor((Date.now()-ts)/864e5);if(d<=0)return '今天';if(d==1)return '昨天';if(d<30)return d+' 天前';return Math.floor(d/30)+' 个月前'}

/* ---------- 状态 / hash ---------- */
var S={p:'',l:'',q:'',t:'',y:'',s:'',o:'new',all:''};
function readHash(){var h=location.hash.slice(1);var o={p:'',l:'',q:'',t:'',y:'',s:'',o:'new',all:''};
  if(!h||h==='talks'||h==='internal')return o;
  if(h[0]!=='?'){var m=h.split('/');o.p=m[0]||'';o.l=(m[1]||'').replace(/^l/,'');return o}
  h.slice(1).split('&').forEach(function(kv){var i=kv.indexOf('=');if(i<0)return;var k=kv.slice(0,i),v=decodeURIComponent(kv.slice(i+1));if(k in o)o[k]=v});
  return o}
function writeHash(){var h;
  if(!S.q&&!S.t&&!S.y&&!S.s&&!S.all){h=S.p?(S.p+(S.l?'/l'+S.l:'')):''}
  else{var parts=[];['p','q','t','y','s','o','all'].forEach(function(k){if(S[k]&&!(k==='o'&&S[k]==='new'))parts.push(k+'='+encodeURIComponent(S[k]))});h='?'+parts.join('&')}
  if(location.hash.slice(1)!==h)history.replaceState(null,'',h?'#'+h:location.pathname)}

/* ---------- 搜索分片 ---------- */
var BODY={},BODYRAW={},loadedYears={},loading=false;
function ensureShards(cb){var years=[];C.pages.forEach(function(p){if(p.year&&!loadedYears[p.year]&&years.indexOf(p.year)<0)years.push(p.year)});
  if(!years.length){cb();return}
  var n=years.length;loading=true;
  years.forEach(function(y){loadedYears[y]=true;var s=document.createElement('script');s.src='search/'+y+'.js?v='+encodeURIComponent(C.generated||'');
    s.onload=s.onerror=function(){var rows=(window.SEARCH_PARTS||{})[y]||[];rows.forEach(function(r){BODYRAW[r.key]=r.text;BODY[r.key]=r.text.toLowerCase()});if(--n===0){loading=false;cb()}};
    document.head.appendChild(s)})}
function terms(){return S.q.toLowerCase().split(/\s+/).filter(Boolean)}
function score(p,ts){var sc=0;var f={title:10,en:8,desc:5,meta:4,tags:4,sections:3};
  var fields={title:p.title,en:p.en,desc:p.desc,meta:[p.teacher,p.speaker,p.unitTitle,p.programName,p.tagText,p.date,p.term].join(' '),tags:(p.tags||[]).join(' '),sections:(p.sections||[]).join(' ')};
  var body=BODY[p.key]||'';
  for(var i=0;i<ts.length;i++){var t=ts[i],hit=false;
    for(var k in fields){if(String(fields[k]||'').toLowerCase().indexOf(t)>=0){sc+=f[k];hit=true}}
    var c=0,idx=-1;while((idx=body.indexOf(t,idx+1))>=0&&c<30)c++;
    if(c){sc+=c;hit=true}
    if(!hit)return 0}
  return sc}
function hl(s,ts){s=esc(s);if(!ts.length)return s;var re=new RegExp('('+ts.map(reEsc).join('|')+')','gi');return s.replace(re,'<mark>$1</mark>')}
function snippet(p,ts){var raw=BODYRAW[p.key]||'';if(!raw||!ts.length)return '';var low=raw.toLowerCase(),i=-1;
  for(var k=0;k<ts.length&&i<0;k++)i=low.indexOf(ts[k]);if(i<0)return '';
  var a=Math.max(0,i-60),b=Math.min(raw.length,i+100);return (a>0?'…':'')+hl(raw.slice(a,b),ts)+(b<raw.length?'…':'')}

/* ---------- 筛选按钮 ---------- */
function btnSet(id,key,opts){var el=$(id);el.innerHTML='';opts.forEach(function(o){var b=document.createElement('button');b.textContent=o[1];if(S[key]===o[0])b.classList.add('on');
  b.onclick=function(){S[key]=(S[key]===o[0]&&key!=='o')?'':o[0];if(key!=='o'&&S[key]&&!S.q)S.all='1';render()};el.appendChild(b)})}
function buildFilters(){var T={},Y={};C.pages.forEach(function(p){if(p.teacher)T[p.teacher]=1;if(p.year)Y[p.year]=1});
  btnSet('fl-teacher','t',Object.keys(T).sort().map(function(t){return [t,t]}));
  btnSet('fl-year','y',Object.keys(Y).sort().reverse().map(function(y){return [y,y]}));
  btnSet('fl-status','s',[['ok','已达标'],['redo','待重做'],['draft','草稿']]);
  btnSet('fl-sort','o',[['new','最新'],['old','最早'],['recent','最近学过'],['rel','相关度']])}
function buildSideNav(){var el=$('side-nav');var h='';var browsing=!S.q&&!S.all&&!S.t&&!S.y&&!S.s;
  C.programs.forEach(function(p){var n=C.pages.filter(function(x){return x.program===p.id}).length;h+='<a href="#'+p.id+'"'+(browsing&&S.p===p.id?' class="on"':'')+'>'+esc(p.name)+' <small>'+p.code+'</small><span class="n">'+(n||'')+'</span></a>'});
  var nt=C.pages.filter(function(x){return x.kind==='talk'}).length,ni=C.pages.filter(function(x){return x.kind==='internal'}).length;
  h+='<a href="#talks">外部讲座<span class="n">'+(nt||'')+'</span></a><a href="#internal">内部会议<span class="n">'+(ni||'')+'</span></a>';
  h+='<a href="#?all=1"'+(!browsing&&!S.q?' class="on"':'')+'>全部页面（按时间）</a>';
  el.innerHTML=h}

/* ---------- 卡片 ---------- */
function card(p,ts){var tag=p.kind==='lesson'?(p.programCode+' Level '+p.level+' · '+esc(p.unitTitle)+' · Week '+p.week):esc(p.tagText||'');
  var lr=lastRead(p.key);var st={ok:'已达标',redo:'待重做',draft:'草稿'}[p.status]||'';
  return '<a class="card" href="'+p.file+'" style="--c:'+(p.accent||'#2E5A66')+'">'
    +'<div class="card-top"><span>'+fmtDate(p.date)+'</span><span class="tag">'+tag+'</span>'+(p.teacher?'<span>'+esc(p.teacher)+'</span>':'')+(st?'<span class="st '+p.status+'">'+st+'</span>':'')+(lr?'<span>'+agoText(lr)+'学过</span>':'')+'</div>'
    +'<div class="ti">'+hl(p.title,ts)+(p.en?'<span>'+hl(p.en,ts)+'</span>':'')+'</div>'
    +(p.desc?'<div class="desc">'+hl(p.desc,ts)+'</div>':'')
    +(ts.length?'<div class="snip">'+snippet(p,ts)+'</div>':'')
    +'</a>'}
function sortList(list,ts){var o=S.o;if(ts.length&&o==='new')o='rel';
  list.sort(function(a,b){if(o==='rel')return ((b._s||0)-(a._s||0))||String(b.date).localeCompare(String(a.date));
    if(o==='old')return String(a.date).localeCompare(String(b.date));
    if(o==='recent')return lastRead(b.key)-lastRead(a.key)||String(b.date).localeCompare(String(a.date));
    return String(b.date).localeCompare(String(a.date))});return list}

/* ---------- 视图：搜索/列表 ---------- */
function renderList(){var ts=terms();var list=[];
  C.pages.forEach(function(p){if(S.t&&p.teacher!==S.t)return;if(S.y&&String(p.year)!==S.y)return;if(S.s&&p.status!==S.s)return;if(S.p&&p.program!==S.p)return;
    if(ts.length){var sc=score(p,ts);if(!sc)return;p._s=sc}else p._s=0;list.push(p)});
  sortList(list,ts);
  var h='<div id="count">'+(ts.length?'搜「'+esc(S.q)+'」：':'')+'共 '+list.length+' 页'+(loading?'（正文索引加载中…）':'')+(S.p?' · 仅 '+esc(progById(S.p).name)+' <a href="#?q='+encodeURIComponent(S.q)+(S.all?'&all=1':'')+'">看全部课程</a>':'')+'</div>';
  if(!list.length)h+='<div class="empty">没有匹配的页面。换个词试试，或清空筛选。</div>';
  else h+='<div class="cards">'+list.map(function(p){return card(p,ts)}).join('')+'</div>';
  $('main').innerHTML=h}

/* ---------- 视图：课程目录 ---------- */
function progById(id){for(var i=0;i<C.programs.length;i++)if(C.programs[i].id===id)return C.programs[i];return C.programs[0]||{levels:[],name:''}}
function unitYears(pid,u){var m={};C.classes.forEach(function(c){if(c.program!==pid||c.unit!==u.id)return;var y=m[c.year]||(m[c.year]={count:0,done:0,teachers:[]});y.count+=c.count;y.done=Math.max(y.done,c.done);if(y.teachers.indexOf(c.teacher)<0)y.teachers.push(c.teacher)});
  return Object.keys(m).sort().reverse().map(function(y){return {year:y,count:m[y].count,done:m[y].done,teachers:m[y].teachers}})}
function renderCatalog(){var P=progById(S.p||(C.programs[0]&&C.programs[0].id));if(!P.id){$('main').innerHTML='<div class="empty">catalog.js 还没生成，先跑 python _build/build_site.py</div>';return}
  var h='';
  var rec=[];C.pages.forEach(function(p){var t=lastRead(p.key);if(t)rec.push([t,p])});rec.sort(function(a,b){return b[0]-a[0]});
  if(rec.length){h+='<div class="recent"><span class="l">继续学习</span>';rec.slice(0,3).forEach(function(r){var p=r[1];h+='<span><a href="'+p.file+'">'+esc(p.title)+'</a> <small>'+(p.kind==='lesson'?'Wk'+p.week+' · '+esc(p.teacher):esc(p.speaker||''))+' · '+agoText(r[0])+'</small></span>'});h+='</div>'}
  h+='<div class="tabs">'+C.programs.map(function(p){var n=C.pages.filter(function(x){return x.program===p.id}).length;return '<a class="tab'+(p.id===P.id?' on':'')+'" href="#'+p.id+'" style="--c:'+p.accent+'"><b>'+esc(p.name)+'</b><small>'+p.code+' · '+esc(p.en)+(n?' · '+n+' 页':'')+'</small></a>'}).join('')+'</div>';
  h+='<div class="phead"><h1>'+esc(P.org||'FOGG')+' '+esc(P.name)+'<span>'+esc(P.en)+'</span></h1>'+(P.desc?'<p>'+esc(P.desc)+'</p>':'')+'</div>';
  if(!P.levels.length)h+='<div class="empty">这门课的等级表还没录入（'+esc(P.name)+' 稍后补）。</div>';
  P.levels.forEach(function(L){var hit=S.l!==''&&String(L.level)===String(S.l);
    h+='<div class="lv'+(hit?' hit':'')+'" id="'+P.id+'-l'+L.level+'" style="--c:'+P.accent+'"><div class="lv-head"><b>Level '+L.level+'</b>'+(L.age?'<span class="age">'+esc(L.age)+' 岁</span>':'')+'<span class="goal">'+esc(L.goal||'')+'</span>'+(L.lexile?'<span class="lex">Lexile '+esc(L.lexile)+'</span>':'')+(L.skills?'<span class="lex">'+esc(L.skills)+'</span>':'')+'</div>';
    h+='<div class="units">';
    if(!L.units.length)h+='<div class="unit none"><div class="t">单元待录入</div></div>';
    L.units.forEach(function(u){var ys=unitYears(P.id,u);var has=ys.length>0;
      var inner='<div class="n">单元 '+u.n+'</div><div class="t">'+esc(u.title)+'</div><div class="e">'+esc(u.en)+'</div><div class="yrs">'
        +(has?ys.map(function(y){return '<span class="yr'+(y.done>=10?' done':'')+'">'+y.year+' · '+y.teachers.join('/')+' · '+y.count+' 课'+(y.done?' · '+y.done+' 达标':'')+'</span>'}).join(''):'<span class="yr">尚未整理</span>')+'</div>';
      h+=has?'<a class="unit has" href="courses/'+P.id+'/'+u.id+'/index.html">'+inner+'</a>':'<div class="unit none">'+inner+'</div>'});
    h+='</div></div>'});
  var other=C.pages.filter(function(p){return p.kind!=='lesson'});
  ['talk','internal'].forEach(function(kind){var list=other.filter(function(p){return p.kind===kind});if(!list.length)return;
    h+='<h2 id="'+(kind==='talk'?'talks':'internal')+'">'+(kind==='talk'?'外部讲座':'内部会议 · 教学大纲')+'</h2>';
    var ys={};list.forEach(function(p){(ys[p.year]||(ys[p.year]=[])).push(p)});
    Object.keys(ys).sort().reverse().forEach(function(y){h+='<h3 class="yr">'+y+'</h3><div class="cards">'+sortList(ys[y],[]).map(function(p){return card(p,[])}).join('')+'</div>'})});
  $('main').innerHTML=h;
  if(S.l!==''){var el=$(P.id+'-l'+S.l);if(el)setTimeout(function(){el.scrollIntoView({block:'start'})},80)}
  else if(location.hash==='#talks'||location.hash==='#internal'){var t=$(location.hash.slice(1));if(t)setTimeout(function(){t.scrollIntoView({block:'start'})},30)}}

function render(){var anchor=location.hash==='#talks'||location.hash==='#internal';if(!anchor)writeHash();buildFilters();buildSideNav();$('q-clr').style.display=S.q?'block':'none';
  if(S.q||S.all||S.t||S.y||S.s)renderList();else renderCatalog()}

/* ---------- 事件 ---------- */
var tmr;$('q').addEventListener('input',function(){clearTimeout(tmr);var v=this.value;tmr=setTimeout(function(){S.q=v.trim();if(S.q)ensureShards(render);render()},160)});
$('q-clr').onclick=function(){$('q').value='';S.q='';S.all='';render()};
window.addEventListener('hashchange',function(){S=readHash();$('q').value=S.q;if(S.q)ensureShards(render);render()});
$('side-toggle').onclick=function(){$('side').classList.toggle('open')};
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a');if(a&&window.innerWidth<=820&&$('side').contains(a))$('side').classList.remove('open')});

/* ---------- Gist 同步 ---------- */
(function(){var CFG_GIST='__cfg_gist_id',CFG_TOKEN='__cfg_gist_token';
  function refresh(){var id=localStorage.getItem(CFG_GIST),t=localStorage.getItem(CFG_TOKEN);$('st-dot').className=(id&&t)?'on':'';$('gist-id').value=id||'';$('sync-status').textContent=(id&&t)?'已配置，所有课页共用':'未配置：填 Gist ID 与 Token（只存在本机浏览器）'}
  $('sync-title').onclick=function(){$('sync-box').classList.toggle('open')};
  $('sync-save').onclick=async function(){var id=$('gist-id').value.trim(),t=$('gist-token').value.trim();if(!id||!t){$('sync-status').textContent='两项都要填';return}
    $('sync-status').textContent='验证中…';
    try{var r=await fetch('https://api.github.com/gists/'+id,{headers:{'Authorization':'token '+t,'Accept':'application/vnd.github+json'}});
      if(!r.ok)throw new Error(r.status);
      localStorage.setItem(CFG_GIST,id);localStorage.setItem(CFG_TOKEN,t);$('gist-token').value='';refresh();$('sync-status').textContent='已保存并验证通过'}
    catch(e){$('sync-status').textContent='验证失败：'+e.message}};
  $('sync-clear').onclick=function(){localStorage.removeItem(CFG_GIST);localStorage.removeItem(CFG_TOKEN);refresh()};
  refresh()})();

$('foot').textContent='共 '+C.pages.length+' 页 · 生成于 '+(C.generated||'').slice(0,10);
S=readHash();$('q').value=S.q;if(S.q)ensureShards(render);render();
})();
</script>
</body>
</html>
