<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>对照阅读</title>
<link rel="stylesheet" href="app.css">
<style>
:root{--bar:52px;--lw:280px;--rw:300px;--soft:#8A9B98;--faint:#A3B2AF;--danger:#B4443A;--vw:#E3EEFB;--vwl:#6FA3DC;--hl:#FFE89A;--amber:#D9A21B}
html{scroll-behavior:auto}
body{background:var(--paper);margin:0;overflow-x:hidden}
body.ui button{font-family:inherit}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- 顶栏 ---------- */
.r-bar{position:sticky;top:0;z-index:30;height:var(--bar);box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 14px;background:rgba(251,251,248,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.r-left{display:flex;align-items:center;gap:4px;min-width:0;flex:1}
.r-right{display:flex;align-items:center;gap:2px;flex:none}
.r-btn{display:inline-flex;align-items:center;gap:6px;height:32px;box-sizing:border-box;border:none;background:none;color:var(--ink);font-size:13px;padding:0 10px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
.r-btn:hover{background:var(--mist)}
.r-btn.on{background:var(--mist);color:var(--ink-deep);font-weight:600}
.r-back{color:var(--soft)}
.r-back:hover{color:var(--ink)}
.r-back .t2{display:none}
.r-sep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.r-title{min-width:0;max-width:100%;font-weight:600;color:var(--ink-deep)}
.r-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-title .ic{width:14px;height:14px;color:var(--soft)}
.r-cnt{display:inline-block;min-width:18px;height:18px;line-height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;font-weight:600;text-align:center}
.r-cnt:empty{display:none}
.r-pillwrap{display:flex;align-items:center;margin:0 4px}
.r-dd{position:relative;min-width:0;display:flex}
.r-menu{display:none;position:absolute;top:calc(100% + 8px);z-index:45;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(22,51,59,.10);padding:6px;min-width:220px;box-sizing:border-box}
.r-menu.open{display:block}
.r-menu.rt{right:0}
.r-menu.lt{left:0;width:320px;max-width:calc(100vw - 28px)}
.r-mi{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;border:none;background:none;text-align:left;color:var(--ink-deep);font-size:13px;padding:8px 10px;border-radius:6px;cursor:pointer;text-decoration:none}
.r-mi:hover{background:var(--mist)}
.r-mi .ic{color:var(--soft)}
.r-mi.danger,.r-mi.danger .ic{color:var(--danger)}
.r-mi.danger:hover{background:#FBEDEB}
.r-mhr{height:1px;background:var(--line);margin:6px 4px}
.r-mlab{font-size:11.5px;color:var(--faint);padding:6px 10px 4px;letter-spacing:.04em}
.r-frow{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;font-size:13px;color:var(--ink-deep)}
.r-frow .lab{flex:1}
.r-frow button{width:32px;height:28px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer;font-size:13px}
.r-frow button:hover{background:var(--mist)}
.r-frow .v{min-width:30px;text-align:center;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.r-docs{max-height:min(50vh,360px);overflow:auto}
.r-docs .r-mi{justify-content:space-between}
.r-docs .r-mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-docs .r-mi small{color:var(--faint);font-size:11.5px;flex:none}
.r-docs .r-mi.on{background:var(--mist);font-weight:600}
.r-docs .r-none{font-size:12.5px;color:var(--faint);padding:8px 10px}

/* ---------- 版面 ---------- */
.r-main{transition:padding .25s ease}
.r-col{max-width:720px;margin:0 auto;padding:44px 28px 160px;box-sizing:border-box}
.r-head{margin:0 0 34px}
.r-head h1{font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.3;font-weight:normal;color:var(--ink-deep);margin:0 0 8px;word-break:break-word}
.r-head .meta{font-size:12.5px;color:var(--soft)}
#prog{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:35;background:var(--ink-deep);color:#fff;font-size:12.5px;padding:7px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(22,51,59,.18);max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center}
#prog:empty{display:none}

/* ---------- 段落 ---------- */
.pg{margin:0 0 26px;padding:4px 0 14px;border-bottom:1px solid #E9EEEC;position:relative;transition:background .2s}
.pg .n{position:absolute;left:-40px;top:8px;width:28px;text-align:right;font-size:11px;color:var(--faint);font-family:-apple-system,'Segoe UI',sans-serif}
.pg .en{font-family:Georgia,'Times New Roman',serif;font-size:var(--fs,18px);line-height:1.8;color:var(--ink-deep);margin:0}
.pg .en mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px;cursor:pointer}
.pg .en mark:hover{outline:none;background:#FBDD72}
.pg .zh{font-size:calc(var(--fs,18px) - 1.5px);line-height:1.85;color:var(--zh);margin:10px 0 0}
.pg .zh.wait{color:#B5C2BF;font-style:italic}
.pg.mark{background:#FFF8DF;border-radius:8px;box-shadow:-12px 0 0 #FFF8DF,12px 0 0 #FFF8DF}
.pg.mark::before{content:'';position:absolute;left:-14px;top:6px;bottom:16px;width:3px;border-radius:2px;background:var(--amber)}
body.hide-zh .pg .zh{display:none}
body.hide-zh .pg:hover .zh{display:block}
.pg .nbox{display:none;margin-top:14px;background:var(--mist);border-left:3px solid var(--ink);border-radius:0 10px 10px 0;padding:8px 14px 10px}
.pg.open-note .nbox{display:block}
.nbox .nh{font-size:12px;color:var(--zh);display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.nbox .nh button{border:none;background:none;color:var(--ink);font-size:12px;cursor:pointer;padding:2px 4px}
.pg .note{display:block;width:100%;border:none;background:transparent;resize:none;font-size:15px;line-height:1.8;min-height:88px;padding:2px 0;box-sizing:border-box;color:var(--ink-deep);font-family:inherit;outline:none;overflow:hidden}
.pg .ops{display:flex;gap:4px;justify-content:flex-end;margin-top:8px;opacity:0;transition:opacity .15s}
.pg:hover .ops,.pg.mark .ops,.pg.has-note .ops,.pg:focus-within .ops{opacity:1}
.pg .ops button{border:1px solid transparent;background:none;color:var(--soft);font-size:12px;border-radius:6px;padding:3px 9px;cursor:pointer}
.pg .ops button:hover{background:var(--mist);color:var(--ink)}
.pg .ops button.on,.pg.has-note .ops button[data-a=note]{background:var(--mist);color:var(--ink-deep);border-color:var(--line)}
.pg .en .vw{background:var(--vw);border-bottom:2px solid var(--vwl);border-radius:3px 3px 0 0;padding:0 1px}
.pg .en .vw.known{background:none;border-bottom:2px dotted #A9C3E0}
.pg.flash{animation:flash 1.6s}
@keyframes flash{0%{background:var(--vw)}100%{background:transparent}}

/* ---------- 空状态 / 说明 ---------- */
.r-welcome{margin:8vh auto 0;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:30px 30px 26px;box-shadow:0 1px 2px rgba(22,51,59,.04)}
.r-welcome h2{font-family:Georgia,serif;font-weight:normal;font-size:24px;color:var(--ink-deep);margin:0 0 6px}
.r-welcome .sub{font-size:14px;color:var(--zh);margin:0 0 20px}
.r-acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.r-pri,.r-sec{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:13px;cursor:pointer;box-sizing:border-box;text-decoration:none}
.r-pri{background:var(--ink);color:#fff;border:1px solid var(--ink)}
.r-pri:hover{background:var(--ink-deep)}
.r-sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.r-sec:hover{background:var(--mist)}
.r-help{font-size:13.5px;line-height:1.75;color:var(--ink-deep)}
.r-help dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 14px}
.r-help dt{font-size:12px;color:var(--soft);padding-top:2px;white-space:nowrap}
.r-help dd{margin:0}
.r-help b{font-weight:600}

/* ---------- 弹窗 ---------- */
.r-mask{display:none;position:fixed;inset:0;z-index:70;background:rgba(22,51,59,.32);align-items:flex-start;justify-content:center;padding:10vh 16px 16px;box-sizing:border-box;overflow:auto}
.r-mask.open{display:flex}
.r-dlg{background:var(--card);border-radius:12px;box-shadow:0 20px 60px rgba(22,51,59,.22);width:100%;max-width:560px;padding:22px 24px 20px;box-sizing:border-box}
.r-dlg h3{font-size:16px;color:var(--ink-deep);margin:0 0 14px;display:flex;align-items:center}
.r-dlg h3 .r-x{margin-left:auto}
.r-dlg input,.r-dlg textarea{display:block;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink-deep);background:var(--paper);outline:none}
.r-dlg input:focus,.r-dlg textarea:focus{border-color:var(--ink);background:#fff}
.r-dlg textarea{min-height:220px;margin-top:10px;resize:vertical;line-height:1.6}
.r-dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.r-x{border:none;background:none;color:var(--soft);width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.r-x:hover{background:var(--mist);color:var(--ink)}

/* ---------- 侧栏 ---------- */
.r-side{position:fixed;top:var(--bar);bottom:0;z-index:25;background:var(--card);display:flex;flex-direction:column;box-sizing:border-box;transition:transform .25s ease,visibility .25s;visibility:hidden;font-size:13px}
#notesSide{left:0;width:var(--lw);border-right:1px solid var(--line);transform:translateX(-100%)}
#vocabSide{right:0;width:var(--rw);border-left:1px solid var(--line);transform:translateX(100%)}
body.notes-on #notesSide,body.vocab-on #vocabSide{transform:none;visibility:visible}
.r-sh{display:flex;align-items:center;padding:14px 12px 10px 18px;flex:none}
.r-sh h3{margin:0;font-size:14px;font-weight:600;color:var(--ink-deep);flex:1}
.r-segs{display:flex;gap:2px;margin:0 16px 10px;padding:3px;background:var(--mist);border-radius:8px;flex:none}
.r-segs button{flex:1;border:none;background:none;color:var(--zh);font-size:12.5px;padding:5px 4px;border-radius:6px;cursor:pointer;white-space:nowrap}
.r-segs button:hover{color:var(--ink-deep)}
.r-segs button.on{background:var(--ink);color:#fff}
.r-segs button small{font-size:11px;opacity:.75;margin-left:2px}
.r-sb{flex:1;overflow:auto;padding:4px 16px 18px;overscroll-behavior:contain}
.r-sf{flex:none;border-top:1px solid var(--line);padding:11px 18px 13px;font-size:12px;color:var(--soft);line-height:1.6}
.r-sf a{color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
.r-sf a:hover{text-decoration:underline}
.r-empty{color:var(--faint);font-size:12.5px;line-height:1.7;padding:22px 6px;text-align:center}

/* 笔记卡 */
.r-nc{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;padding:9px 12px 10px;margin:0 0 8px;cursor:pointer;background:var(--card);transition:background .15s,border-color .15s}
.r-nc:hover{background:#F6F9F8}
.r-nc.k-mark{border-left-color:var(--amber)}
.r-nc.k-hl{border-left-color:#EBCB4A}
.r-nc .nm{font-size:11.5px;color:var(--soft);margin-bottom:3px}
.r-nc .ns{font-family:Georgia,serif;font-size:13px;line-height:1.55;color:#5A6B68;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.r-nc.k-note .ns{-webkit-line-clamp:1;color:var(--faint);font-size:12.5px}
.r-nc .ns mark{background:var(--hl);color:var(--ink-deep);border-radius:2px;padding:0 1px}
.r-nc .nt{font-size:13.5px;line-height:1.6;color:var(--ink-deep);white-space:pre-wrap;margin-top:4px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow:hidden}

/* 生词行 */
.r-vh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--soft);margin:12px 2px 4px;font-weight:600;letter-spacing:.02em}
.r-vh:first-child{margin-top:4px}
button.r-vh{border:none;background:none;padding:4px 0;cursor:pointer;width:100%;text-align:left;font-family:inherit}
button.r-vh:hover{color:var(--ink)}
.r-vh .ic{width:13px;height:13px;transition:transform .2s}
.r-vh.open .ic{transform:rotate(90deg)}
.r-vr{position:relative;border-radius:8px;margin:0 -8px;padding:0 8px}
.r-vr:hover,.r-vr.open{background:#F4F8F7}
.r-vr .top{display:flex;align-items:baseline;gap:10px;padding:8px 0;cursor:pointer;min-width:0}
.r-vr .w{font-family:Georgia,serif;font-size:15.5px;color:var(--ink-deep);flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-vr .z{font-size:13px;color:var(--zh);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-vr.known .w,.r-vr.known .z{color:var(--faint)}
.r-vr .x{display:none;padding:0 0 10px;font-size:12.5px;line-height:1.6}
.r-vr.open .x{display:block}
.r-vr .ph{color:var(--soft);font-family:Georgia,serif;margin-bottom:2px}
.r-vr .d{color:var(--soft);margin-bottom:6px}
.r-vr .c{font-family:Georgia,serif;color:#5A6B68;line-height:1.6;border-left:2px solid var(--line);padding-left:9px;margin-bottom:6px}
.r-vr .c b{color:var(--ink-deep);background:var(--vw);font-weight:normal}
.r-vr .s{color:var(--faint);font-size:11.5px;margin-bottom:6px}
.r-va{display:flex;gap:4px;flex-wrap:wrap}
.r-va button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;border-radius:6px;padding:2px 9px;cursor:pointer}
.r-va button:hover{background:var(--mist)}
.r-va button[data-a=rm]:hover{color:var(--danger);border-color:#E7C4BF;background:#FBEDEB}
.r-vr .qa{position:absolute;right:6px;top:5px;display:none;gap:2px;background:#F4F8F7;padding-left:8px;box-shadow:-10px 0 8px #F4F8F7}
.r-vr:hover .qa{display:flex}
.r-vr.open .qa{display:none}
.r-vr .qa button{border:none;background:none;color:var(--soft);font-size:12px;padding:3px 6px;border-radius:5px;cursor:pointer}
.r-vr .qa button:hover{background:var(--card);color:var(--ink)}

/* ---------- 选词浮窗 ---------- */
#pop{position:fixed;z-index:50;display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 32px rgba(22,51,59,.14);padding:14px 16px 12px;width:300px;max-width:calc(100vw - 32px);box-sizing:border-box;font-size:14px}
#pop .pw{font-family:Georgia,serif;font-size:18px;color:var(--ink-deep);word-break:break-word}
#pop .pz{color:var(--ink);margin-top:6px;font-size:15px}
#pop .pd{color:var(--zh);margin-top:4px;font-size:12.5px;line-height:1.6}
#pop .pd:empty{display:none}
#pop .pb{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#pop .pb button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;border-radius:6px;padding:4px 10px;cursor:pointer}
#pop .pb button:hover{background:var(--mist)}
#pop .pb button.done{background:var(--ink);color:#fff;border-color:var(--ink)}

.r-scrim{display:none;position:fixed;inset:0;z-index:55;background:rgba(22,51,59,.28)}

/* 宽度不够时才给打开的一侧让位 */
@media(min-width:761px) and (max-width:1339px){body.notes-on .r-main{padding-left:var(--lw)}}
@media(min-width:761px) and (max-width:1379px){body.vocab-on .r-main{padding-right:var(--rw)}}
@media(max-width:960px){.pg .n{position:static;display:block;width:auto;text-align:left;margin-bottom:2px}.pg.mark::before{left:-8px}}
@media(max-width:860px){.r-btn .lb2{display:none}}
@media(max-width:760px){
  .r-side{top:0;z-index:60;width:min(340px,88vw)!important;box-shadow:0 0 40px rgba(22,51,59,.2);border:none!important}
  body.notes-on .r-scrim,body.vocab-on .r-scrim{display:block}
  .r-col{padding:28px 18px 140px}
  .r-head h1{font-size:23px}
  .pg .ops{opacity:1}
  .pg.mark{box-shadow:-8px 0 0 #FFF8DF,8px 0 0 #FFF8DF}
}
@media(max-width:600px){
  .r-bar{padding:0 8px;gap:2px}
  .r-pillwrap,.r-sep,.r-back .t1{display:none}
  .r-back .t2{display:inline}
  .r-btn{padding:0 7px}
  .r-right .hide-s{display:none}
  .r-welcome{padding:22px 18px}
  .r-help dl{grid-template-columns:1fr;gap:2px}
  .r-help dd{margin-bottom:8px}
}
</style>
</head>
<body class="ui">
<input type="file" id="file" accept=".txt,.pdf,.docx,.epub,text/plain,application/pdf,image/*" hidden multiple>
<header class="r-bar" translate="no">
  <div class="r-left">
    <a class="r-btn r-back" href="index.html#books" title="回到阅读记录"><span class="t1">← 阅读记录</span><span class="t2">←</span></a>
    <span class="r-sep"></span>
    <div class="r-dd">
      <button class="r-btn r-title" id="docBtn" title="切换文章"><span id="docTitle">对照阅读</span><svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="r-menu lt" id="docMenu">
        <div class="r-mlab">文章</div>
        <div class="r-docs" id="list"></div>
        <div class="r-mhr"></div>
        <label class="r-mi" for="file" data-close><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>载入文件</label>
        <button class="r-mi" data-act="paste" data-close><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>粘贴文字</button>
      </div>
    </div>
  </div>
  <div class="r-right">
    <button class="r-btn on" id="tgZh" title="显示 / 隐藏中文">中文</button>
    <button class="r-btn" id="notesBtn" title="笔记栏">笔记</button>
    <button class="r-btn" id="vocabBtn" title="生词本">生词 <span class="r-cnt" id="vocabCnt"></span></button>
    <button class="r-btn hide-s" id="speak" title="朗读全文,再点一下停止">朗读</button>
    <span class="r-pillwrap"><span id="syncPill"></span></span>
    <div class="r-dd">
      <button class="r-btn" id="moreBtn" title="更多">更多<svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="r-menu rt" id="moreMenu">
        <label class="r-mi" for="file" data-close><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg>载入文件</label>
        <button class="r-mi" id="paste" data-close><svg class="ic" viewBox="0 0 24 24"><rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>粘贴文字</button>
        <div class="r-frow"><span class="lab">字号</span><button id="fsDn" title="缩小">A−</button><span class="v" id="fsVal"></span><button id="fsUp" title="放大">A+</button></div>
        <button class="r-mi" id="speak2" data-close><svg class="ic" viewBox="0 0 24 24"><path d="M5 9v6h4l5 4V5L9 9H5zM17 9a4 4 0 010 6"/></svg>朗读全文</button>

        <a class="r-mi" href="words.html"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4zM5 17a3 3 0 013-3h11"/></svg>生词库</a>

<script>
(function(){
var LS='__reader_docs',VK='__reader-vocab',cur=null;

function load(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return {}}}

function $(id){return document.getElementById(id)}

var HELP='<dl>'+
  '<dt>载入</dt><dd>「载入文件」支持 txt、PDF、Word(docx)、epub、图片。扫描版 PDF 和照片会在浏览器里做文字识别(OCR),比较慢,可能有错字。也可以「粘贴文字」。文件只在这台电脑上处理,不上传、不进仓库。</dd>'+
  '<dt>翻译</dt><dd>每段自动翻成中文(机器翻译,存在本机)。顶栏「中文」关掉后,鼠标移到哪段才显示哪段中文。</dd>'+
  '<dt>选词</dt><dd><b>用鼠标选中一个词或短语</b>,马上显示中文和词典释义,可以「存入生词本」(进总目录的「今日复习」,正文里标成蓝色)、「划线」(黄色,点一下取消)、「记到笔记」。</dd>'+
  '<dt>段落</dt><dd>每段下方有「整段重点」「笔记」「朗读」。</dd>'+
  '<dt>侧栏</dt><dd>左边「笔记」收集本篇的笔记、重点段落和划线,点一条跳到那一段;右边「生词」是生词本。所有文章的生词都在「生词库」,删除文章不会删掉生词。</dd>'+
  '<dt>同步</dt><dd>在「更多 › 云端同步设置」里打开后,笔记、重点、划线和生词会在你的几台设备之间同步。</dd>'+
  '</dl>';
$('helpBody').innerHTML=HELP;
function split(t){
  t=t.replace(/\r/g,'').replace(/^﻿/,'').replace(/([A-Za-z])-\n\s*([a-z])/g,'$1$2');
  var parts=/\n\s*\n/.test(t)?t.split(/\n\s*\n/):t.split(/\n/);

    .filter(function(p){return p&&!/^\d{1,4}$/.test(p)});
  var out=[];
  parts.forEach(function(p){
    var prev=out[out.length-1];
    if(prev&&(!/[.!?'"’”:;)—-]$/.test(prev)||/^[a-z]/.test(p)))out[out.length-1]=prev+' '+p;
    else out.push(p);

}
var VER=2;

var nt=0;

var rgt;addEventListener('resize',function(){clearTimeout(rgt);rgt=setTimeout(function(){document.querySelectorAll('.pg.open-note .note').forEach(grow)},150)});
function setEn(i){var d=load(),x=d[cur],en=document.querySelector('.pg[data-i="'+i+'"] .en');if(en&&x){en.innerHTML=enHtml(x.p[i],(x.h||{})[i]);paint(en)}}
function repaint(){var d=load(),x=d[cur];if(!x)return;document.querySelectorAll('#doc .pg').forEach(function(el){setEn(el.dataset.i)})}
function reEsc(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function vre(){
  var v=vload().map(function(w){return w.word}).filter(Boolean).sort(function(a,b){return b.length-a.length});
  return v.length?new RegExp('\\b('+v.map(reEsc).join('|')+')\\b','gi'):null;
}
function paint(en){
  var re=vre();if(!re||!en)return;
  var km={};vload().forEach(function(w){km[w.word.toLowerCase()]=w.known});
  var tw=document.createTreeWalker(en,NodeFilter.SHOW_TEXT),ns=[],t;
  while((t=tw.nextNode()))if(!t.parentNode.closest('.vw'))ns.push(t);
  ns.forEach(function(n){
    var s=n.nodeValue;re.lastIndex=0;if(!re.test(s))return;re.lastIndex=0;
    var f=document.createDocumentFragment(),last=0,m;
    while((m=re.exec(s))){
      if(m.index>last)f.appendChild(document.createTextNode(s.slice(last,m.index)));
      var sp=document.createElement('span');sp.className='vw'+(km[m[0].toLowerCase()]?' known':'');sp.textContent=m[0];f.appendChild(sp);
      last=m.index+m[0].length;
    }
    if(last<s.length)f.appendChild(document.createTextNode(s.slice(last)));
    n.parentNode.replaceChild(f,n);
  });
}
function jump(i,openNote){
  var el=document.querySelector('.pg[data-i="'+i+'"]');if(!el)return;
  if(openNote&&!el.classList.contains('open-note')){el.classList.add('open-note');grow(el.querySelector('.note'))}

  closeDrawers();
}
function cut(t,n){t=String(t||'').replace(/\s+/g,' ').trim();return t.length>n?t.slice(0,n)+'…':t}
var busy=false;
function latin(z){var a=(z.match(/[A-Za-z]/g)||[]).length,c=(z.match(/[一-鿿]/g)||[]).length;return a>c*0.6}
function prep(t){return t.replace(/(^|[\s(—-])'/g,'$1"').replace(/'(?=[\s,.!?;:)—-]|$)/g,'"')}
function tr1(t){
  t=prep(t);
  return tr0(t).then(function(z){
    if(!latin(z))return z;
    var ss=t.match(/[^.!?]+[.!?]+["']?\s*|[^.!?]+$/g)||[t];
    return Promise.all(ss.map(tr0)).then(function(a){return a.join('')});
  });
}
var GTX='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&hl=zh-CN';
function tr0(t){
  return fetch(GTX+'&dt=t&q='+encodeURIComponent(t))
    .then(function(r){if(!r.ok)throw r.status;return r.json()})
    .then(function(j){return (j[0]||[]).map(function(s){return s[0]||''}).join('')});
}
function translateAll(){
  if(busy)return;var d=load(),k=cur,x=d[k];if(!x)return;
  var todo=[];x.p.forEach(function(p,i){if(!(x.z||{})[i])todo.push(i)});
  if(!todo.length){prog('');return}
  busy=true;var done=0,fail=0,pos=0;
  function show(){prog('正在翻译 '+done+' / '+todo.length+(fail?'(失败 '+fail+' 段,稍后刷新页面会重试)':''))}
  show();
  function next(){
    if(pos>=todo.length)return Promise.resolve();
    var i=todo[pos++];
    return tr1(x.p[i]).then(function(z){
      var d=load();if(!d[k])return;d[k].z=d[k].z||{};d[k].z[i]=z;save(d);done++;
      if(k===cur){var el=document.querySelector('.pg[data-i="'+i+'"] .zh');if(el){el.textContent=z;el.classList.remove('wait')}}
    },function(){fail++;
      if(k===cur){var el=document.querySelector('.pg[data-i="'+i+'"] .zh');if(el)el.textContent='(这段没翻成功,刷新页面重试)'}
    }).then(function(){show();return next()});
  }

}
function say(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}

/* ---------- 选词:翻译 + 生词本 + 划线 ---------- */
function vload(){try{var v=JSON.parse(localStorage.getItem(VK));return Array.isArray(v)?v:[]}catch(e){return []}}
function vsave(v){try{localStorage.setItem(VK,JSON.stringify(v))}catch(e){alert('保存失败')}vcount();renderVocab();repaint()}
function vcount(){var n=vload().filter(function(w){return !w.known}).length;$('vocabCnt').textContent=n||''}
var pop=$('pop'),sel=null;
function hidePop(){pop.style.display='none';sel=null}
function sentenceOf(p,w){
  p=String(p||'');var lw=String(w||'').toLowerCase();
  var ss=p.match(/[^.!?]+[.!?]+["'’”]?\s*|[^.!?]+$/g)||[p],s='';
  for(var k=0;k<ss.length;k++)if(ss[k].toLowerCase().indexOf(lw)>=0){s=ss[k].trim();break}
  if(!s)return '';
  if(s.length>200){
    var at=s.toLowerCase().indexOf(lw),a=Math.max(0,at-90),b=Math.min(s.length,at+lw.length+100);
    while(a>0&&s[a-1]!==' '&&at-a<110)a--;while(b<s.length&&s[b]!==' ')b++;
    s=(a>0?'…':'')+s.slice(a,b).trim()+(b<s.length?'…':'');
  }
  return s;
}
function lookup(w){
  return fetch(GTX+'&dt=t&dt=bd&q='+encodeURIComponent(w)).then(function(r){if(!r.ok)throw r.status;return r.json()}).then(function(j){
    var zh=(j[0]||[]).map(function(s){return s[0]||''}).join('');
    var def=(j[1]||[]).map(function(b){return b[0]+' '+(b[1]||[]).slice(0,4).join('; ')}).join(' / ');
    return {zh:zh,def:def};
  });
}
function showPop(){
  var s=getSelection();if(!s.rangeCount)return;
  var t=String(s).replace(/\s+/g,' ').trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,'');
  if(!t||t.length>80||t.split(' ').length>8){hidePop();return}
  var r=s.getRangeAt(0),en=(r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentNode).closest('.en');
  if(!en){hidePop();return}
  var pg=en.closest('.pg'),i=pg.dataset.i,d=load(),x=d[cur];
  var word=t.split(' ').length===1?t.toLowerCase():t;
  if(/^[A-Z][a-z]/.test(t)&&t.split(' ').length===1)word=t;
  sel={w:t,word:word,i:i,ctx:sentenceOf(x.p[i],t),zh:'',def:''};
  var have=vload().some(function(v){return v.word.toLowerCase()===word.toLowerCase()});
  pop.innerHTML='<div class="pw">'+esc(t)+'</div><div class="pz">查询中…</div><div class="pd"></div>'+
    '<div class="pb"><button data-a="say">朗读</button><button data-a="vocab"'+(have?' class="done"':'')+'>'+(have?'已在生词本':'存入生词本')+'</button>'+
    '<button data-a="hl">划线</button><button data-a="note">记到笔记</button></div>';
  var rc=r.getBoundingClientRect();pop.style.display='block';
  var pw=pop.offsetWidth,ph=pop.offsetHeight;
  var left=Math.max(16,Math.min(rc.left,innerWidth-pw-16));
  var top=rc.bottom+8;if(top+ph>innerHeight-8)top=Math.max(8,rc.top-ph-8);
  pop.style.left=left+'px';pop.style.top=top+'px';
  var me=sel;
  lookup(t).then(function(o){if(sel!==me)return;me.zh=o.zh;me.def=o.def;
    pop.querySelector('.pz').textContent=o.zh||'';pop.querySelector('.pd').textContent=o.def||'';
  },function(){if(sel===me)pop.querySelector('.pz').textContent='(查询失败,检查网络)'});
}
document.addEventListener('mouseup',function(e){if(pop.contains(e.target))return;setTimeout(showPop,10)});
document.addEventListener('touchend',function(e){if(pop.contains(e.target))return;setTimeout(showPop,300)});
document.addEventListener('mousedown',function(e){if(!pop.contains(e.target))hidePop()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')hidePop()});
addEventListener('scroll',function(){if(pop.style.display==='block')hidePop()},{passive:true});
pop.onclick=function(e){
  var b=e.target.closest('button');if(!b||!sel)return;var a=b.dataset.a;
  if(a==='say')say(sel.w);

    var v=vload(),lw=sel.word.toLowerCase(),ex=v.filter(function(w){return w.word.toLowerCase()===lw})[0];

    vsave(v);RS.touch();b.textContent='已在生词本';b.classList.add('done');getSelection().removeAllRanges();
  }
  if(a==='hl'){
    var d=load(),x=d[cur];x.h=x.h||{};var arr=x.h[sel.i]=x.h[sel.i]||[];
    if(arr.indexOf(sel.w)<0)arr.push(sel.w);saveDoc(d,x);
    getSelection().removeAllRanges();setEn(sel.i);renderNotes();hidePop();
  }
  if(a==='note'){
    var d=load(),x=d[cur];x.n=x.n||{};var line=sel.w+(sel.zh?' — '+sel.zh:'');
    x.n[sel.i]=(x.n[sel.i]?x.n[sel.i]+'\n':'')+line;saveDoc(d,x);

    if(el){var ta=el.querySelector('.note');ta.value=x.n[sel.i];el.classList.add('has-note','open-note');grow(ta)}

  }
};
function addDoc(k,text){

}
function welcome(){
  return '<div class="r-welcome" translate="no"><h2>对照阅读</h2><p class="sub">载入一篇英文,每段自动配上中文。选词查义、存生词、划线、写笔记。</p>'+
    '<div class="r-acts"><label class="r-pri" for="file">载入文件</label><button class="r-sec" data-act="paste">粘贴文字</button></div>'+
    '<div class="r-help">'+HELP+'</div></div>';

function render(){

  x.p.forEach(function(p,i){
    var m=(x.m||{})[i],n=(x.n||{})[i]||'';
    h+='<div class="pg'+(m?' mark':'')+(n?' has-note open-note':'')+'" data-i="'+i+'"><span class="n" translate="no">'+(i+1)+'</span>'+
      '<p class="en" translate="no">'+enHtml(p,(x.h||{})[i])+'</p>'+((x.z||{})[i]?'<p class="zh" translate="no">'+esc(x.z[i])+'</p>':'<p class="zh wait" translate="no">翻译中…</p>')+
      '<div class="nbox" translate="no"><div class="nh"><span>笔记 · 第 '+(i+1)+' 段</span><button data-a="fold">收起</button></div><textarea class="note" placeholder="这段的笔记 / 生词 / 想法…">'+esc(n)+'</textarea></div>'+
      '<div class="ops" translate="no"><button data-a="mark"'+(m?' class="on"':'')+'>整段重点</button><button data-a="note">笔记</button><button data-a="say">朗读</button></div></div>';
  });

    var i=el.dataset.i;
    el.querySelector('.ops').onclick=function(e){
      var a=e.target.dataset.a;if(!a)return;var d=load(),x=d[cur];
      if(a==='mark'){x.m=x.m||{};x.m[i]=!x.m[i];el.classList.toggle('mark',!!x.m[i]);e.target.classList.toggle('on',!!x.m[i]);saveDoc(d,x);renderNotes()}

    ((x.h||{})[i]||[]).forEach(function(s){c.hl++;items.push({k:'hl',i:i,h:'<div class="r-nc k-hl" data-i="'+i+'"><div class="nm">第 '+(i+1)+' 段 · 划线</div><div class="ns"><mark>'+esc(s)+'</mark></div></div>'})});

/* ---------- 载入文件:txt / pdf / docx / epub / 图片(OCR) ---------- */
var libs={};
function lib(u){return libs[u]||(libs[u]=new Promise(function(ok,no){var s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=function(){delete libs[u];no('组件载入失败,检查网络')};document.head.appendChild(s)}))}
var PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    PDFW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
    TESS='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
    MAMMOTH='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js',
    JSZIP='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function readAs(f,how){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){ok(r.result)};r.onerror=no;r[how](f,how==='readAsText'?'utf-8':undefined)})}
var ocrW=null;
function ocr(src,label){
  return lib(TESS).then(function(){
    if(!ocrW)ocrW=Tesseract.createWorker('eng',1,{logger:function(m){if(m.status==='recognizing text')prog(label+' · 识别中 '+Math.round(m.progress*100)+'%')}});
    return ocrW;
  }).then(function(w){prog(label+' · 识别中…');return w.recognize(src)}).then(function(r){return r.data.text});
}
function pdfText(buf,name){
  return lib(PDFJS).then(function(){
    pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
    return pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    var pages=[],n=pdf.numPages,chars=0;
    function textPage(k){
      if(k>n)return Promise.resolve();
      prog('「'+name+'」读取第 '+k+' / '+n+' 页');
      return pdf.getPage(k).then(function(pg){return pg.getTextContent()}).then(function(tc){
        var lines=[],last=null;
        tc.items.forEach(function(it){
          if(!('str' in it))return;var y=Math.round(it.transform[5]),hgt=Math.abs(it.transform[3])||10;
          if(!last||Math.abs(y-last.y)>hgt*0.5){last={y:y,h:hgt,t:''};lines.push(last)}
          last.t+=it.str;
        });
        var gaps=[];for(var q=1;q<lines.length;q++)gaps.push(lines[q-1].y-lines[q].y);
        var med=gaps.slice().filter(function(g){return g>0}).sort(function(a,b){return a-b})[Math.floor(gaps.length/2)]||12;
        var out='';
        lines.forEach(function(l,q){if(q&&gaps[q-1]>med*1.5)out+='\n';out+=l.t+'\n'});
        chars+=out.replace(/\s/g,'').length;pages.push(out);
        return textPage(k+1);
      });
    }
    return textPage(1).then(function(){
      if(chars>=n*30)return pages.join('\n\n');
      if(!confirm('「'+name+'」看起来是扫描版(没有文字层),要用文字识别(OCR)吗?共 '+n+' 页,每页大约 5–20 秒。'))return '';
      var txt=[];
      function ocrPage(k){
        if(k>n)return Promise.resolve();
        return pdf.getPage(k).then(function(pg){
          var vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
          return pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise.then(function(){return ocr(c,'「'+name+'」第 '+k+' / '+n+' 页')});
        }).then(function(t){txt.push(t);return ocrPage(k+1)});
      }
      return ocrPage(1).then(function(){return txt.join('\n\n')});
    });
  });
}
function docxText(buf){return lib(MAMMOTH).then(function(){return mammoth.extractRawText({arrayBuffer:buf})}).then(function(r){return r.value})}
function epubText(buf){
  return lib(JSZIP).then(function(){return JSZip.loadAsync(buf)}).then(function(z){
    var dp=new DOMParser();
    return z.file('META-INF/container.xml').async('string').then(function(c){
      var opf=dp.parseFromString(c,'application/xml').querySelector('rootfile').getAttribute('full-path'),base=opf.replace(/[^\/]*$/,'');
      return z.file(opf).async('string').then(function(o){
        var x=dp.parseFromString(o,'application/xml'),man={};
        [].forEach.call(x.getElementsByTagName('item'),function(it){man[it.getAttribute('id')]=it.getAttribute('href')});
        var hrefs=[].map.call(x.getElementsByTagName('itemref'),function(r){return man[r.getAttribute('idref')]}).filter(Boolean);
        return Promise.all(hrefs.map(function(h){var f=z.file(base+decodeURIComponent(h.split('#')[0]));return f?f.async('string'):''}));
      });
    }).then(function(htmls){
      return htmls.map(function(h){
        var doc=dp.parseFromString(h,'text/html'),bs=doc.querySelectorAll('p,h1,h2,h3,h4,h5,li,blockquote');
        if(!bs.length)return (doc.body&&doc.body.textContent)||'';
        return [].map.call(bs,function(b){return b.textContent.replace(/\s+/g,' ').trim()}).filter(Boolean).join('\n\n');
      }).join('\n\n');
    });
  });
}
function base(n){return n.replace(/\.(txt|pdf|docx|epub|png|jpe?g|gif|webp|bmp|tiff?|heic)$/i,'')}
$('file').onchange=function(){
  var files=[].slice.call(this.files);this.value='';
  var imgs=files.filter(function(f){return /^image\//.test(f.type)}).sort(function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true})});
  var rest=files.filter(function(f){return !/^image\//.test(f.type)});
  var chain=Promise.resolve();
  rest.forEach(function(f){chain=chain.then(function(){
    var n=f.name,k=base(n);
    if(/\.pdf$/i.test(n))return readAs(f,'readAsArrayBuffer').then(function(b){return pdfText(b,n)}).then(function(t){if(t)addDoc(k,t)});
    if(/\.docx$/i.test(n))return readAs(f,'readAsArrayBuffer').then(docxText).then(function(t){addDoc(k,t)});
    if(/\.epub$/i.test(n)){prog('「'+n+'」读取中…');return readAs(f,'readAsArrayBuffer').then(epubText).then(function(t){addDoc(k,t)})}
    if(/\.doc$/i.test(n)){alert('旧版 .doc 读不了,请在 Word 里另存为 .docx');return}
    return readAs(f,'readAsText').then(function(t){addDoc(k,t)});
  }).catch(function(e){alert('「'+f.name+'」载入失败:'+(e&&e.message||e))})});
  if(imgs.length)chain=chain.then(function(){
    var txt=[],q=0;
    function one(){if(q>=imgs.length)return Promise.resolve();var f=imgs[q++];
      return ocr(f,'图片 '+q+' / '+imgs.length).then(function(t){txt.push(t);return one()})}
    return one().then(function(){addDoc(base(imgs[0].name)+(imgs.length>1?' 等 '+imgs.length+' 张':''),txt.join('\n\n'))});
  }).catch(function(e){alert('图片识别失败:'+(e&&e.message||e))});
  chain.then(function(){if(!busy)prog('')});
};
